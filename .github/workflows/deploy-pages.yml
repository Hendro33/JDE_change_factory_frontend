name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Switches to the real api_service automatically once a
          # hosted backend exists and its URL is set as the
          # VITE_API_BASE_URL repository variable (Settings > Secrets
          # and variables > Actions > Variables) -- until then this is
          # empty, so the build stays on the mock API exactly as
          # today. Never a secret: this is just a public HTTPS URL,
          # baked into a public static site either way.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_MOCK_API: ${{ vars.VITE_API_BASE_URL != '' && 'false' || 'true' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
