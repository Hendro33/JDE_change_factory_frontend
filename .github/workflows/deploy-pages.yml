name: Deploy to GitHub Pages

# Automatic deployment from main is switched off: Jade's frontend moves to Azure (DEV first).
# This workflow runs only when started by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # The app always talks to the backend at the VITE_API_BASE_URL repository variable
          # (Settings > Secrets and variables > Actions > Variables); with no
          # hosted backend, sign-in says plainly that the backend cannot be
          # reached. Never a secret: just a public HTTPS URL.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
