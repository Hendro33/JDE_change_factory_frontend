name: Deploy to Azure DEV

# Every push to the dev branch builds the frontend against the Jade DEV
# backend and publishes it to Azure Static Web Apps (jade-dev-web in resource
# group jade-dev). main is the stable baseline and is never deployed from here;
# the jade.consultiq.nl GitHub Pages site is not touched.
#
# No secret is stored for this: GitHub signs in to Azure with a short-lived
# federated token (OIDC) for an identity limited to the jade-dev resource group
# and this repository's dev branch, and fetches the Static Web App's deployment
# token for this run only (masked). The IDs below are repository variables.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for Jade DEV
        env:
          VITE_API_BASE_URL: ${{ vars.JADE_DEV_API_URL }}
        run: npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch the deployment token for this run
        id: swa
        run: |
          token=$(az staticwebapp secrets list -g jade-dev -n jade-dev-web --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
